function suggestUnis(q){

function suggestSkills(q,list){

if(blank)return top+`<div class="empty" style="padding:24px 0">Start filling in the form and your profile appears here.</div>`;
return top+`<div style="margin-bottom:12px">${avatarHtml(d.photo,d.name,"xl")}</div>

<section class="fsec"><h2 class="fh">Your CVs</h2><div class="cvgrid">

<li>Say what you are looking for: the kind of internship or project, and why it interests you.</li>

function chipsHtml(){return S.draft.skills.map((s,i)=>`<span class="chip2">${esc(s)}<button type="button" aria-label="Remove ${esc(s)}" data-rm="${i}">&times;</button></span>`).join("")}
function initProfile(){
const d=S.draft,$=id=>document.getElementById(id);
const name=$("pf-name"),uni=$("pf-uni"),field=$("pf-field"),bio=$("pf-bio"),sk=$("pf-skill"),chips=$("pf-chips"),cl=$("pf-chiplist");
name.addEventListener("input",()=>{d.name=name.value;updPreview()});
bio.addEventListener("input",()=>{d.bio=bio.value;updPreview()});
field.addEventListener("change",()=>{d.field=field.value;updPreview()});
for(const [id,k] of [["pf-course","course"],["pf-year","year"],["pf-gm","gm"],["pf-gy","gy"],["pf-exp","exp"],["pf-li","linkedin"]]){const el=$(id);const fn=()=>{d[k]=el.value;updPreview()};el.addEventListener("input",fn);el.addEventListener("change",fn)}
const drawChips=()=>{cl.innerHTML=chipsHtml();const n=d.skills.length,full=n>=MAX_SKILLS;$("pf-count").textContent=n+" of "+MAX_SKILLS;sk.placeholder=full?"Remove a skill to add another":"Type a skill, like Communication"};
drawChips();
const uc=attachCombo({input:uni,list:$("uni-list"),items:suggestUnis,pick:v=>{uni.value=v;d.school=v;uc.close();updPreview()}});
uni.addEventListener("input",()=>{d.school=uni.value;updPreview()});
const addSkill=v=>{
let n=v.replace(/\s+/g," ").trim().slice(0,40);if(!n)return;
const known=SKILLS.find(s=>s.n.toLowerCase()===n.toLowerCase());if(known)n=known.n;
if(d.skills.some(s=>s.toLowerCase()===n.toLowerCase())){sk.value="";return}
if(d.skills.length>=MAX_SKILLS){toast("You can choose up to "+MAX_SKILLS+" skills. Remove one to add another.");sk.value="";return}
d.skills.push(n);sk.value="";drawChips();updPreview();skc.refresh();sk.focus()};
const skc=attachCombo({input:sk,list:$("sk-list"),items:suggestSkills,pick:addSkill,custom:true,back:()=>{if(d.skills.length){d.skills.pop();drawChips();updPreview();skc.refresh()}}});
cl.addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b){d.skills.splice(+b.dataset.rm,1);drawChips();updPreview();sk.focus()}});
chips.addEventListener("click",e=>{if(e.target===chips)sk.focus()});
const file=$("pf-photo"),up=$("pf-up"),rm=$("pf-rm"),msg=$("pf-msg");
const showMsg=t=>{msg.textContent=t;msg.hidden=!t};
const redraw=()=>{$("pf-avatar").innerHTML=avatarHtml(d.photo,d.name,"lg");up.textContent=d.photo?"Change photo":"Upload photo";rm.hidden=!d.photo;$("pf-adj").hidden=!(d.photo&&S.cropImg);updPreview()};
up.addEventListener("click",()=>file.click());
rm.addEventListener("click",()=>{d.photo="";S.cropImg=null;showMsg("");redraw()});
const adj=$("pf-adj");adj.addEventListener("click",()=>{if(S.cropImg)openCrop(S.cropImg,url=>{d.photo=url;redraw()},adj)});
name.addEventListener("input",()=>{if(!d.photo)$("pf-avatar").innerHTML=avatarHtml("",d.name,"lg")});
file.addEventListener("change",()=>{
const f=file.files&&file.files[0];if(!f)return;showMsg("");
if(!/^image\//.test(f.type)){showMsg("Choose an image file, like a JPG or PNG.");file.value="";return}
if(f.size>8*1024*1024){showMsg("That file is over 8 MB. Choose a smaller photo.");file.value="";return}
const r=new FileReader();
r.onerror=()=>showMsg("We couldn\u2019t read that image. Try a different file.");
r.onload=()=>{const img=new Image();
img.onerror=()=>showMsg("We couldn\u2019t read that image. Try a different file.");
img.onload=()=>{const sq=Math.min(img.naturalWidth,img.naturalHeight);
S.cropImg=img;
openCrop(img,url=>{d.photo=url;redraw();if(sq<300)showMsg("This photo is quite small, so it may look blurry. A larger one will look sharper.")});
file.value=""};img.src=r.result};
r.readAsDataURL(f)});
const vf=$("cv-video"),vup=$("cv-v-up"),vrm=$("cv-v-rm"),vmsg=$("cv-v-msg"),df=$("cv-doc"),dup=$("cv-d-up"),drm=$("cv-d-rm"),dmsg=$("cv-d-msg");
const note=(el,t)=>{el.textContent=t;el.hidden=!t};
const redrawCv=()=>{const vs=$("cv-v-status"),ds=$("cv-d-status");
vs.innerHTML=cvVideoStatus(d);vs.className="file"+(d.cvVideo?"":" none");vup.textContent=d.cvVideo?"Replace video":"Upload video";vrm.hidden=!d.cvVideo;
ds.innerHTML=cvDocStatus(d);ds.className="file"+(d.cvDoc?"":" none");dup.textContent=d.cvDoc?"Replace document":"Upload document";drm.hidden=!d.cvDoc;
updMedia();updPreview()};
vup.addEventListener("click",()=>vf.click());
dup.addEventListener("click",()=>df.click());
vrm.addEventListener("click",()=>{d.cvVideo=null;note(vmsg,"");redrawCv()});
drm.addEventListener("click",()=>{d.cvDoc=null;note(dmsg,"");redrawCv()});
vf.addEventListener("change",()=>{
const f=vf.files&&vf.files[0];if(!f)return;note(vmsg,"");
if(!/^video\//.test(f.type)){note(vmsg,"Choose a video file, like an MP4 or MOV.");vf.value="";return}
if(f.size>200*1024*1024){note(vmsg,"That video is over 200 MB. Trim it or export a smaller version.");vf.value="";return}
const url=URL.createObjectURL(f),probe=document.createElement("video");probe.preload="metadata";
probe.onerror=()=>{URL.revokeObjectURL(url);note(vmsg,"We couldn’t play that video. Try an MP4 from your phone.")};
probe.onloadedmetadata=()=>{const dur=isFinite(probe.duration)?probe.duration:0;
d.cvVideo={url,name:f.name,size:f.size,dur};redrawCv();
if(dur>120)note(vmsg,"Your video is "+fmtDur(dur)+". Shorter videos are easier for businesses to watch, so consider trimming it to under 2 minutes.")};
probe.src=url;vf.value=""});
df.addEventListener("change",()=>{
const f=df.files&&df.files[0];if(!f)return;note(dmsg,"");
if(!/\.(pdf|docx?)$/i.test(f.name)){note(dmsg,"Choose a PDF, DOC or DOCX file.");df.value="";return}
if(f.size>5*1024*1024){note(dmsg,"That file is over 5 MB. Compress it or export a smaller version.");df.value="";return}
d.cvDoc={name:f.name,size:f.size};redrawCv();df.value=""})
}

const STOPW=new Set(["university","of","the","and","college","for"]);
function uniDomainOk(uni,email){
const dom=email.split("@")[1].toLowerCase();
if(!/\.ac\.uk$/.test(dom))return "ac";
if(!UNIS.includes(uni))return "ok";
const label=dom.split(".").slice(-3)[0];
const words=uni.toLowerCase().replace(/\(.*?\)/g,"").replace(/[^a-z\s]/g," ").split(/\s+/).filter(w=>w&&!STOPW.has(w));
const abbr=(UNI_ABBR[uni]||"").toLowerCase().split(/\s+/).map(a=>a.replace(/[^a-z0-9]/g,"")).filter(Boolean);
if(abbr.includes(label)||label===words.join(""))return "ok";
if(words.length===1&&words[0]===label)return "ok";
if(words.length===2&&words[1]===label)return "ok";
return "no"}

const otpEls=()=>[...document.querySelectorAll("#vf-otp .otp-d")];
const otpValue=()=>otpEls().map(e=>e.value).join("");
function initOtp(){
const els=otpEls();if(!els.length)return;
const fill=(start,digits)=>{let i=start;for(const ch of digits){if(i>5)break;els[i].value=ch;i++}
els[Math.min(i,5)].focus();
if(otpValue().length===6)setTimeout(()=>{if(S.view==="verify"&&S.ver&&S.ver.step===2)checkCode()},150)};
els.forEach((el,i)=>{
el.addEventListener("input",()=>{const d=el.value.replace(/\D/g,"");el.value="";if(d)fill(i,d)});
el.addEventListener("keydown",e=>{
if(e.key==="Backspace"){e.preventDefault();if(el.value)el.value="";else if(i>0){els[i-1].value="";els[i-1].focus()}}
else if(e.key==="ArrowLeft"&&i>0){e.preventDefault();els[i-1].focus()}

el.addEventListener("paste",e=>{e.preventDefault();const t=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\D/g,"");if(t)fill(0,t.slice(0,6))});

const INDUSTRIES=["Accounting & Finance","Architecture & Construction","Charity & Non-profit","Creative & Design","Education","Engineering","Health & Social Care","Hospitality & Tourism","Legal","Marketing & Media","Retail","Science & Research","Technology","Other"];
function coBadge(c,sz){const px={md:44,lg:56,xl:96}[sz]||44;
return c.logo?`<img class="logoimg ${sz}" src="${c.logo}" alt="">`:`<div class="badge" style="width:${px}px;height:${px}px;font-size:${Math.round(px*.43)}px;flex:none">${esc((c.name||"?")[0].toUpperCase())}</div>`}
function isOn(k){return S.view===k||(k==="browse"&&S.view==="matches")||(k==="applications"&&S.view==="interviews"&&!!S.user&&S.user.role==="student")||(k==="queue"&&S.view==="review")||(k==="mine"&&["applicants","applicant","editco","suggested","candidate","schedule"].includes(S.view))}
function appsFor(id){return S.apps.filter(a=>a.job===id&&a.status!=="withdrawn")}
function statusPill(s){return `<span class="pill ${s}">${{new:"New",shortlisted:"Shortlisted",declined:"Declined",withdrawn:"Withdrawn"}[s]}</span>`}
function dashboard(){
const c=S.myCo,js=S.jobs.filter(j=>j.co===c.id),all=S.apps.filter(a=>js.some(j=>j.id===a.job));
const nw=all.filter(a=>a.status==="new").length,open=js.filter(j=>j.open!==false).length;
const rows=js.map(j=>{const n=appsFor(j.id),nn=n.filter(a=>a.status==="new").length,isOpen=j.open!==false;
return `<div class="jobrow"><div style="min-width:0"><h3>${esc(j.title)}${isOpen?"":` <span class="tag">Closed</span>`}</h3>${tags(j)}</div>
<div class="jr-r"><span class="cpill">${n.length} applicant${n.length===1?"":"s"}${nn?`, ${nn} new`:""}</span><button class="btn sm" onclick="go('applicants',${j.id})">View applicants</button><button class="btn ghost sm" onclick="go('suggested',${j.id})">Suggested shortlist</button><button class="btn ghost sm" onclick="toggleJob(${j.id})">${isOpen?"Close":"Reopen"}</button></div></div>`}).join("");
return `<div class="dash-head"><div class="dh-l">${coBadge(c,"lg")}<div><h1>${esc(c.name)}</h1><div class="meta">${esc(c.ind)} in ${esc(c.loc)}</div></div></div>
<div class="cta-row"><button class="btn ghost sm" onclick="go('company',${c.id})">View public page</button><button class="btn ghost sm" onclick="go('editco')">Edit company profile</button><button class="btn sm" onclick="go('post')">Post an internship</button></div></div>
<p class="summary">${js.length?`<b>${nw} new</b> to review. ${all.length} applicant${all.length===1?"":"s"} across ${js.length} internship${js.length===1?"":"s"}, ${open} open.`:"You have not posted an internship yet."}</p>
<h2 style="font-size:20px;margin-bottom:10px">Your internships</h2>
${js.length?`<div class="list">${rows}</div>`:`<div class="list"><div class="empty">Post your first internship and students can start applying.<div style="margin-top:12px"><button class="btn" onclick="go('post')">Post an internship</button></div></div></div>`}`}
function toggleJob(id){const j=S.jobs.find(x=>x.id===id);j.open=j.open===false;toast(j.open?"Internship reopened":"Internship closed. Students can no longer apply.");render()}
function setAppFilter(f){S.appFilter=f;render()}
function ownJob(id){const j=S.jobs.find(x=>x.id==id);return j&&S.myCo&&j.co===S.myCo.id?j:null}
function applicants(){
const g=gate("business","Log in to see your applicants.");if(g)return g;
const j=ownJob(S.id);if(!j)return `<div class="panel"><h2>Internship not found</h2><button class="btn" onclick="go('mine')">Back to dashboard</button></div>`;
const all=S.apps.filter(a=>a.job===j.id),f=S.appFilter,cnt=s=>all.filter(a=>a.status===s).length;
const list=all.filter(a=>f==="all"||a.status===f);
const chip=(k,l,n)=>`<button class="chip ${f===k?"on":""}" onclick="setAppFilter('${k}')">${l} (${n})</button>`;
const rows=list.map(a=>{const s=a.student,extra=s.skills.length-3;
return `<button class="row" onclick="go('applicant',${a.id})">${avatarHtml(s.photo,s.name,"xl").replace("av-xl","av-md")}<div class="mid"><h3>${esc(s.name)}${vtag(s)}${a.demo?` <span class="tag">Example</span>`:""}</h3><div class="meta">${esc(s.school||"University not added")}${s.field?", "+esc(s.field):""}</div>
<div class="tags">${s.skills.slice(0,3).map(k=>`<span class="tag">${esc(k)}</span>`).join("")}${extra>0?`<span class="tag">+${extra} more</span>`:""}${s.cvVideo?`<span class="tag paid">Video CV</span>`:""}${s.cvDoc?`<span class="tag">Document CV</span>`:""}</div></div>
<div class="rt">${statusPill(a.status)}<span class="d">Applied ${esc(a.date)}</span></div></button>`}).join("");
return `<button class="back" onclick="go('mine')">Back to dashboard</button><h1 style="font-size:30px;margin-bottom:4px">Applicants for ${esc(j.title)}</h1>${tags(j)}
<div class="tools" style="margin-top:16px">${chip("all","All",all.length)}${chip("new","New",cnt("new"))}${chip("shortlisted","Shortlisted",cnt("shortlisted"))}${chip("declined","Declined",cnt("declined"))}${cnt("withdrawn")?chip("withdrawn","Withdrawn",cnt("withdrawn")):""}</div>
${list.length?`<div class="list">${rows}</div>`:`<div class="list"><div class="empty">${all.length?"No applicants with this status.":"No applications yet. Students appear here as soon as they apply."}</div></div>`}
${all.some(a=>a.demo)?`<p class="meta" style="margin-top:12px">Applicants marked Example are sample data for the prototype.</p>`:""}`}
function setStatus(id,s){const a=S.apps.find(x=>x.id===id);a.status=s;toast({shortlisted:"Applicant shortlisted",declined:"Applicant declined",new:"Moved back to new"}[s]);render()}
function applicant(){
const g=gate("business","Log in to see your applicants.");if(g)return g;
const a=S.apps.find(x=>x.id==S.id),j=a&&ownJob(a.job);
if(!a||!j)return `<div class="panel"><h2>Applicant not found</h2><button class="btn" onclick="go('mine')">Back to dashboard</button></div>`;
const s=a.student;
return `<button class="back" onclick="go('applicants',${j.id})">Back to applicants</button>
<div class="panel"><div class="dash-head" style="margin-bottom:0"><div class="dh-l">${avatarHtml(s.photo,s.name,"lg")}<div><h1 style="font-size:28px">${esc(s.name)}${vtag(s)}${a.demo?` <span class="tag" style="vertical-align:middle">Example</span>`:""}</h1><div class="meta">${esc(s.school||"University not added")}</div></div></div>${statusPill(a.status)}</div>
${tgroups(s.field,s.skills.map(k=>`<span class="tag">${esc(k)}</span>`).join(""))}
<p class="meta" style="margin:12px 0 0">Applied for ${esc(j.title)} on ${esc(a.date)}</p>
${a.status==="withdrawn"?`<p class="meta" style="margin:14px 0 0">${esc(s.name)} withdrew this application. You cannot shortlist or decline it.</p>`:`<div class="appbar">${a.status!=="shortlisted"?`<button class="btn" onclick="setStatus(${a.id},'shortlisted')">Shortlist</button>`:""}${a.status!=="declined"?`<button class="btn ghost" onclick="setStatus(${a.id},'declined')">Decline</button>`:""}${a.status!=="new"?`<button class="link" onclick="setStatus(${a.id},'new')">Move back to new</button>`:""}</div>`}
${a.status!=="declined"&&a.status!=="withdrawn"?ivPanel(a,j):""}
<p style="margin:14px 0 0">${a.status==="shortlisted"?`Contact: <b>${esc(s.email||"No email on file")}</b>`:`<span class="meta">Contact details are shared when you shortlist an applicant.</span>`}</p></div>
${s.cvVideo?`<div class="panel vidpanel" style="margin-top:14px"><h2>Video CV</h2><video controls preload="metadata" src="${s.cvVideo.url}" aria-label="Video CV for ${esc(s.name)}"></video></div>`:""}
<div class="two2"><div class="panel"><h2>About</h2><p style="margin:0">${s.bio?esc(s.bio):`<span class="meta">No introduction added.</span>`}</p></div>
<div class="panel"><h2>Document CV</h2>${s.cvDoc?`<p style="margin:0;overflow-wrap:anywhere"><b>${esc(s.cvDoc.name)}</b><br><span class="meta">${fmtSize(s.cvDoc.size)}. Previews are not available in the prototype.</span></p>`:`<p class="meta" style="margin:0">No document CV added.</p>`}</div></div>`}
function initCoDraft(){const c=S.myCo;S.coDraft=c?{name:c.name,ind:c.ind,loc:c.loc,about:c.about==="No description yet."?"":c.about,logo:c.logo||""}:null}
function coPv(){const d=S.coDraft;return `<div class="meta" style="margin:0 0 14px">How students will see you</div>${coBadge(d,"xl")}<h2 style="margin-top:12px">${esc(d.name||"Your business name")}</h2><div class="meta">${esc(d.ind)}${d.loc?" in "+esc(d.loc):""}</div><p style="margin:14px 0 0">${d.about?esc(d.about):`<span class="meta">Tell students what your business does and what interns can expect.</span>`}</p>`}
function editco(){
const g=gate("business","Log in to edit your company profile.");if(g)return g;
if(!S.myCo)return `<div class="panel"><h2>Create your business profile first</h2><button class="btn" onclick="go('mine')">Set up business profile</button></div>`;
if(!S.coDraft)initCoDraft();const d=S.coDraft;
const inds=INDUSTRIES.includes(d.ind)?INDUSTRIES:[d.ind,...INDUSTRIES];
return `<button class="back" onclick="go('mine')">Back to dashboard</button><h1 style="font-size:32px;margin-bottom:16px">Company profile</h1><div class="split"><div class="panel"><div class="stack">
<div><label>Logo</label><div class="photo"><div id="co-logo">${coBadge(d,"xl")}</div><div><div class="cta-row"><button type="button" class="btn ghost sm" id="co-up">${d.logo?"Change logo":"Upload logo"}</button><button type="button" class="btn ghost sm" id="co-rm" ${d.logo?"":"hidden"}>Remove</button></div><input type="file" id="co-file" accept="image/*" hidden><div class="hint">JPG or PNG. A square logo on a plain background looks best.</div><div class="err" id="co-msg" role="alert" hidden></div></div></div></div>
<div><label for="co-name">Business name</label><input class="in" id="co-name" value="${esc(d.name)}"></div>
<div><label for="co-ind">Industry</label><select class="in" id="co-ind">${inds.map(o=>`<option ${o===d.ind?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
<div><label for="co-loc">Location</label><input class="in" id="co-loc" placeholder="e.g. Manchester" value="${esc(d.loc)}"></div>
<div><label for="co-about">About your business</label><textarea class="in" id="co-about" style="min-height:140px">${esc(d.about)}</textarea><div class="hint">Say what you do and what an intern can expect. Students read this before they apply.</div></div>
<button class="btn" onclick="saveEditCo()" style="justify-self:start">Save company profile</button></div></div>
<aside class="panel pv" id="co-pv" aria-live="polite">${coPv()}</aside></div>`}
function initEditCo(){
const d=S.coDraft,$=id=>document.getElementById(id);

const FIELD_MAP={Design:["Art & Design","Architecture","Fashion & Textiles","Games & Animation","Photography & Video"],Engineering:["Computer Science & IT","Cybersecurity","Data Science & Analytics","Artificial Intelligence","Electrical & Electronic Engineering","Engineering (general)","Mechanical Engineering","Civil Engineering","Mathematics & Statistics","Physics"],Marketing:["Marketing & Advertising","PR & Communications","Journalism","Creative Writing","Sales","Film & Television"],Finance:["Accounting & Finance","Economics","Business & Management","Entrepreneurship"]};

function matchScore(s,j){
const have=(s.skills||[]).map(x=>x.toLowerCase()),want=j.skills||[];
const fieldOk=!!(FIELD_MAP[j.field]&&FIELD_MAP[j.field].includes(s.field));
const hit=want.filter(x=>have.includes(x.toLowerCase())),miss=want.filter(x=>!have.includes(x.toLowerCase()));
const score=want.length?(fieldOk?40:0)+Math.round(60*hit.length/want.length):(fieldOk?100:0);
let tier="";
if(fieldOk||hit.length>=2){tier=score>=75?"Strong match":score>=50?"Good match":score>=15?"Possible match":""}
return{score,fieldOk,hit,miss,tier}}
function tierTag(m){return m.tier?`<span class="${m.tier==="Strong match"?"tag paid":m.tier==="Good match"?"tag good":"tag"}">${m.tier}</span>`:""}
function reasons(m,s,who){
const out=[];
if(m.fieldOk&&s.field)out.push(who==="biz"?`Studies ${esc(s.field)}`:`Fits your interest in ${esc(s.field)}`);
if(m.hit.length)out.push((who==="biz"?"Has ":"You have ")+m.hit.map(esc).join(", "));
return out.join(". ")}

function openCrop(img,done,back){
const prevFocus=document.activeElement;
const root=document.createElement("div");root.id="crop-root";
root.innerHTML=`<div class="cropbox" role="dialog" aria-modal="true" aria-labelledby="cr-t"><h2 id="cr-t">Crop your photo</h2><div class="meta">Drag to move it. Use the slider to zoom. The circle is what people will see.</div>
<div class="cropstage" id="cr-st" tabindex="0" aria-label="Photo crop area. Use arrow keys to move the photo."><img id="cr-img" alt=""><div class="cropmask"></div><div class="cropring"></div></div>
<div class="cropzoom"><label for="cr-z" style="margin:0;font-weight:500">Zoom</label><input type="range" id="cr-z" min="100" max="300" value="100"></div>
<div class="cta-row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn ghost" id="cr-x">Cancel</button><button type="button" class="btn" id="cr-ok">Use photo</button></div></div>`;
document.body.appendChild(root);document.body.style.overflow="hidden";
const st=root.querySelector("#cr-st"),im=root.querySelector("#cr-img"),z=root.querySelector("#cr-z");
im.src=img.src;
let N=st.clientWidth,min=N/Math.min(img.naturalWidth,img.naturalHeight),sc=min,x=0,y=0;
const clamp=()=>{const w=img.naturalWidth*sc,hh=img.naturalHeight*sc;x=Math.min(0,Math.max(N-w,x));y=Math.min(0,Math.max(N-hh,y))};
const draw=()=>{clamp();im.style.width=img.naturalWidth*sc+"px";im.style.height=img.naturalHeight*sc+"px";im.style.transform=`translate(${x}px,${y}px)`};
x=(N-img.naturalWidth*sc)/2;y=(N-img.naturalHeight*sc)/2;draw();
const setZoom=v=>{const old=sc;sc=min*v/100;const cx=N/2,cy=N/2;x=cx-(cx-x)*sc/old;y=cy-(cy-y)*sc/old;draw()};
z.addEventListener("input",()=>setZoom(+z.value));
let drag=null;
st.addEventListener("pointerdown",e=>{drag={px:e.clientX,py:e.clientY,x,y};st.setPointerCapture(e.pointerId);st.classList.add("drag")});
st.addEventListener("pointermove",e=>{if(!drag)return;x=drag.x+e.clientX-drag.px;y=drag.y+e.clientY-drag.py;draw()});
const end=()=>{drag=null;st.classList.remove("drag")};
st.addEventListener("pointerup",end);st.addEventListener("pointercancel",end);
st.addEventListener("wheel",e=>{e.preventDefault();z.value=Math.max(100,Math.min(300,+z.value-e.deltaY/4));setZoom(+z.value)},{passive:false});
st.addEventListener("keydown",e=>{const k={ArrowLeft:[20,0],ArrowRight:[-20,0],ArrowUp:[0,20],ArrowDown:[0,-20]}[e.key];if(k){e.preventDefault();x+=k[0];y+=k[1];draw()}});
const close=()=>{root.remove();document.body.style.overflow="";document.removeEventListener("keydown",esc2);try{(back||prevFocus).focus()}catch(e){}};
const esc2=e=>{if(e.key==="Escape")close();if(e.key==="Tab"){const f=[...root.querySelectorAll("button,input,[tabindex='0']")];const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}};
document.addEventListener("keydown",esc2);
root.querySelector("#cr-x").onclick=close;
root.querySelector("#cr-ok").onclick=()=>{const c=document.createElement("canvas");c.width=c.height=480;
c.getContext("2d").drawImage(img,-x/sc,-y/sc,N/sc,N/sc,0,0,480,480);
const url=c.toDataURL("image/jpeg",.88);close();done(url)};
root.querySelector("#cr-ok").focus()}

const sec=[["p1","Contact details"],["p2","What information we collect, use, and why"],["p3","Lawful bases and data protection rights"],["p4","Where we get personal information from"],["p5","How long we keep information"],["p6","Who we share information with"],["p7","How to complain"]];

return `<div class="doc"><h1 style="font-size:clamp(30px,5vw,42px);color:var(--brand)">RightTern customer privacy notice</h1>
<p class="meta" style="margin-top:6px">Last updated 21 October 2026</p>
<p>This privacy notice tells you what to expect us to do with your personal information.</p>
<nav class="toc" aria-label="Contents"><strong>Contents</strong><ol>${sec.map(s=>`<li><a href="#${s[0]}" onclick="return jumpTo('${s[0]}')">${s[1]}</a></li>`).join("")}</ol></nav>

<h2 id="p2">What information we collect, use, and why</h2>
<h3>We collect or use the following information to provide and improve products and services for clients:</h3>${L(["Names and contact details","Usage data (including information about how you interact with and use our website, products and services)","Information relating to compliments or complaints","Website user information"])}

<h3>We collect or use the following personal information for business accounts and internship listings:</h3>${L(["Contact name and email address","Company name, industry, location, description and logo","Internships you post, including the skills you are looking for and the salary","Decisions on applicants (for example shortlisted or declined)","Interview times you offer"])}
<h3>We collect or use the following personal information for the operation of client or customer accounts:</h3>${L(["Names and contact details","Purchase or service history","Account information, including registration details","Information used for security purposes"])}
<h3>We collect or use the following personal information to comply with legal requirements:</h3>${L(["Name","Contact information","Any other personal information required to comply with legal obligations"])}
<h3>We collect or use the following personal information for dealing with queries, complaints or claims:</h3>${L(["Names and contact details","Purchase or service history","Correspondence"])}
<h2 id="p3">Lawful bases and data protection rights</h2>
<p>Under UK data protection law, we must have a &#8220;lawful basis&#8221; for collecting and using your personal information. There is a list of possible lawful bases in the UK GDPR. You can find out more about lawful bases on the ICO&#8217;s website.</p>
<p>Which lawful basis we rely on may affect your data protection rights which are set out in brief below. You can find out more about your data protection rights and the exemptions which may apply on the ICO&#8217;s website:</p>
${L(["<b>Your right of access</b> - You have the right to ask us for copies of your personal information. You can request other information such as details about where we get personal information from and who we share personal information with. There are some exemptions which means you may not receive all the information you ask for.","<b>Your right to rectification</b> - You have the right to ask us to correct or delete personal information you think is inaccurate or incomplete.","<b>Your right to erasure</b> - You have the right to ask us to delete your personal information.","<b>Your right to restriction of processing</b> - You have the right to ask us to limit how we can use your personal information.","<b>Your right to object to processing</b> - You have the right to object to the processing of your personal data.","<b>Your right to data portability</b> - You have the right to ask that we transfer the personal information you gave us to another organisation, or to you.","<b>Your right to withdraw consent</b> - When we use consent as our lawful basis you have the right to withdraw your consent at any time."])}
<p>If you make a request, we must respond to you without undue delay and in any event within one month.</p>
<p>To make a data protection rights request, please contact us using the contact details at the top of this privacy notice.</p>
<h3>Our lawful bases for the collection and use of your data</h3>
${L(Object.entries(bases).map(([k,v])=>`<b>${k}</b> - ${v}`))}
<table class="table"><thead><tr><th>What we use personal information for</th><th>Lawful bases we rely on</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table>
<h2 id="p4">Where we get personal information from</h2>${L(["Directly from you","From businesses, about your applications (for example whether you are shortlisted)","Publicly available sources"])}
<h2 id="p5">How long we keep information</h2><table class="table"><thead><tr><th>Information</th><th>How long we keep it</th></tr></thead><tbody>${ret.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table>
<p>For more information on how long we store your personal information or the criteria we use to determine this please contact us using the details provided above.</p>
<h2 id="p6">Who we share information with</h2><h3>Others we share personal information with</h3>${L(["<b>Businesses</b> - If you are a student, businesses you apply to, or that invite you and you accept, can see your profile, including your photo and any CV you add. We share your email address with a business once it shortlists you.","<b>Students</b> - If you are a business, students can see your company profile and the internships you post.","<b>Service providers</b> - Companies that host our data and send our emails on our behalf, only so we can run RightTern.","Organisations we&#8217;re legally obliged to share personal information with"])}
<h2 id="p7">How to complain</h2><p>If you have any concerns about our use of your personal information, you can make a data protection complaint to us:</p><p>Email: <b>contact@righttern.com</b></p>
<p>If you remain unhappy with how we&#8217;ve used your data after raising a complaint with us, you can also complain to the ICO.</p>
<p>The ICO&#8217;s address:<br>ICO Head Office<br>4th Floor, No.3 Circle Square<br>5 Hawkshaw Street<br>Manchester<br>M1 7BL<br>Helpline number: 0303 123 1113<br>Website: <a href="https://www.ico.org.uk/make-a-complaint" target="_blank" rel="noopener" style="color:var(--blue)">https://www.ico.org.uk/make-a-complaint</a></p>
<p style="margin-top:28px"><button class="btn ghost" onclick="go('home')">Back to home</button></p></div>`}
function jumpTo(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:"smooth",block:"start"});return false}
const WD_LIMIT=3,WD_DAYS=30,COOL_DAYS=7,DAY=864e5;
const fmtD=ts=>new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const myEmail=()=>S.user?S.user.email:"";
const myApps=()=>S.apps.filter(a=>a.student.email===myEmail());
function activeApp(jobId){return S.user?S.apps.find(a=>a.job===jobId&&a.student.email===S.user.email&&a.status!=="withdrawn"):null}
function myWds(){const now=Date.now();return S.wd.filter(w=>w.email===myEmail()&&now-w.at<WD_DAYS*DAY)}
function wdLeft(){return Math.max(0,WD_LIMIT-myWds().length)}
function wdReset(){const w=myWds().sort((a,b)=>a.at-b.at)[0];return w?w.at+WD_DAYS*DAY:null}
function coolUntil(jobId){if(!S.user)return null;const w=S.wd.filter(x=>x.email===myEmail()&&x.job===jobId).sort((a,b)=>b.at-a.at)[0];if(!w)return null;const t=w.at+COOL_DAYS*DAY;return t>Date.now()?t:null}
function withdraw(id){S.confirmWd=id;render()}
function keepApp(){S.confirmWd=null;render()}
function doWithdraw(id){
const a=S.apps.find(x=>x.id===id);if(!a||a.student.email!==myEmail())return;
if(wdLeft()<1){toast("You have used all "+WD_LIMIT+" withdrawals for this month.");S.confirmWd=null;render();return}
a.status="withdrawn";a.withdrawnAt=Date.now();S.wd.push({job:a.job,email:myEmail(),at:Date.now()});
S.interviews.forEach(i=>{if(i.email===myEmail()&&i.job===a.job&&i.status!=="cancelled")i.status="cancelled"});
S.invites.forEach(i=>{if(i.job===a.job&&i.email===myEmail()&&i.status==="applied")i.status="sent"});
S.confirmWd=null;toast("Application withdrawn");render()}
function appStatusLine(a){
const iv=activeIv(a.student.email,a.job);
if(a.status==="withdrawn"){const cu=coolUntil(a.job);return `You withdrew this on ${fmtD(a.withdrawnAt)}. ${cu?"You can apply again on "+fmtD(cu)+".":"You can apply again."}`}
if(a.status==="declined")return "The business has decided not to take this application further. There are more openings to try.";
if(iv&&iv.status==="confirmed")return `Interview confirmed for ${fmtSlot(iv.slots[iv.pick])}.`;
if(iv&&iv.status==="proposed")return "The business has offered you interview times. Pick one to confirm.";
if(iv&&iv.status==="nofit")return "You told the business none of their interview times worked. They can send new ones.";
if(a.status==="shortlisted")return "Good news, you have been shortlisted. The business may be in touch.";
return "Sent. The business has not responded yet."}
const appPill=a=>a.status==="new"?`<span class="pill new">Sent</span>`:a.status==="shortlisted"?`<span class="pill shortlisted">Shortlisted</span>`:a.status==="declined"?`<span class="pill declined">Not progressing</span>`:`<span class="pill declined">Withdrawn</span>`;
function applications(){
const g=gate("student","Log in to see your applications.");if(g)return g;
const all=myApps().sort((a,b)=>b.id-a.id),act=all.filter(a=>a.status==="new"||a.status==="shortlisted"),done=all.filter(a=>a.status==="declined"||a.status==="withdrawn");
const left=wdLeft(),rs=wdReset();
const card=a=>{const j=S.jobs.find(x=>x.id===a.job),c=co(j.co),conf=S.confirmWd===a.id,iv=activeIv(a.student.email,a.job);
let acts="";
if(conf){acts=`<div class="ivbox" style="background:var(--surf)"><h3>Withdraw this application?</h3><p class="meta" style="margin:4px 0 0;max-width:40em">${esc(c.name)} will see that you withdrew. ${iv?"Your interview for this internship will be cancelled. ":""}You will not be able to apply for it again for ${COOL_DAYS} days. This uses one of your ${WD_LIMIT} withdrawals each month, and you have ${left} left.</p><div class="appbar"><button class="btn" onclick="doWithdraw(${a.id})">Yes, withdraw</button><button class="btn ghost" onclick="keepApp()">Keep my application</button></div></div>`}
else{acts=`<div class="appbar" style="margin-top:12px"><button class="btn ghost sm" onclick="go('job',${j.id})">View internship</button>${iv&&iv.status==="proposed"?`<button class="btn sm" onclick="go('interviews')">Choose an interview time</button>`:""}${a.status==="new"||a.status==="shortlisted"?(left>0?`<button class="link" onclick="withdraw(${a.id})">Withdraw application</button>`:`<span class="hint" style="margin:0">Withdrawals used up until ${fmtD(rs)}</span>`):""}${a.status==="withdrawn"&&!coolUntil(a.job)&&j.open!==false?`<button class="btn sm" onclick="apply(${j.id})">Apply again</button>`:""}</div>`}
return `<div class="ivcard"><div style="display:flex;gap:14px;align-items:flex-start">${coBadge(c,"md")}<div style="min-width:0;flex:1"><h3>${esc(j.title)} ${appPill(a)}</h3><div class="meta">${esc(c.name)} in ${esc(jobLoc(j))}, ${esc(fmtPay(j))}</div><div class="meta">Applied ${esc(a.date)}</div><p style="margin:8px 0 0;max-width:42em">${esc(appStatusLine(a))}</p>${acts}</div></div></div>`};
const sect=(t,l,empty)=>`<h2 style="font-size:20px;margin:24px 0 10px">${t} (${l.length})</h2>${l.length?`<div class="list">${l.map(card).join("")}</div>`:`<div class="list"><div class="empty">${empty}</div></div>`}`;
return `<h1 style="font-size:32px;margin-bottom:6px">Your applications</h1><p class="meta" style="margin:0;max-width:46em">See where each application stands. Changed your mind? You can withdraw an application, up to ${WD_LIMIT} a month, so businesses are not left guessing. You have <b>${left} of ${WD_LIMIT}</b> withdrawals left${rs&&left<WD_LIMIT?", renewing from "+fmtD(rs):""}.</p>
${sect("Active",act,`No active applications. <div style="margin-top:12px"><button class="btn" onclick="go('browse')">Browse internships</button></div>`)}${done.length?sect("Closed",done,""):""}`}
function seedMine(){
const A={name:"Alex Morgan",school:"University of Manchester",field:"Art & Design",skills:["Figma","Branding","Creativity","Teamwork"],bio:"Second-year design student looking for hands-on studio experience.",photo:"",cvVideo:null,cvDoc:null,email:"alex@example.com"};
[[3,"shortlisted","4 Nov"],[5,"new","8 Nov"],[4,"declined","29 Oct"]].forEach(([job,status,date])=>S.apps.push({id:S.nextApp++,job,status,date,student:Object.assign({},A)}))}

seedApps();seedMatch();seedIv();seedMine();seedQueue();render();window.addEventListener("hashchange",()=>{if(S.view==="login")render()});
</script>
